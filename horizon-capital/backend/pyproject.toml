[project]
name = "horizon-capital"
version = "0.2.0"
description = "Autonomous AI Hedge Fund Platform"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "starlette>=0.36,<1.0",

    # Database
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.20,<1.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",

    # Redis
    "redis>=5.0,<8.0",

    # Data serialization & validation
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.1,<3.0",
    "orjson>=3.9,<4.0",

    # Data & numerics
    "pandas>=2.0,<4.0",
    "numpy>=1.26,<3.0",

    # Logging
    "structlog>=24.1,<26.0",

    # HTTP client
    "httpx>=0.27,<1.0",

    # Security
    "python-jose[cryptography]>=3.3,<4.0",
    "passlib[bcrypt]>=1.7,<2.0",
    "bcrypt>=4.0,<6.0",

    # TUI
    "rich>=13.0,<15.0",

    # Market data
    "yfinance>=0.2,<2.0",
    "websockets>=12.0,<17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.23,<2.0",
    "ruff>=0.3,<1.0",
    "mypy>=1.8,<2.0",
]

[project.scripts]
horizon = "app.__main__:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
