# Horizon Capital Redis Configuration

# Memory
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence (AOF for durability)
appendonly yes
appendfsync everysec

# Pub/Sub
# Allow enough output buffer for pub/sub clients
client-output-buffer-limit pubsub 32mb 8mb 60

# Security
protected-mode no

# Performance
tcp-keepalive 300
timeout 0
