<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Horizon Capital</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #080b11;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      -webkit-app-region: drag;
      user-select: none;
      border-radius: 12px;
      overflow: hidden;
    }
    .icon {
      width: 40px;
      height: 40px;
      background: rgba(107, 138, 253, 0.15);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .icon-inner {
      width: 16px;
      height: 16px;
      background: #6b8afd;
      border-radius: 4px;
    }
    .title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: #e2e8f0;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 11px;
      color: #4a5568;
      margin-bottom: 28px;
      letter-spacing: 0.3px;
    }
    .loader {
      width: 24px;
      height: 24px;
      border: 2px solid rgba(107, 138, 253, 0.15);
      border-top-color: #6b8afd;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="icon"><div class="icon-inner"></div></div>
  <div class="title">Horizon Capital</div>
  <div class="subtitle">Starting up...</div>
  <div class="loader"></div>
</body>
</html>
